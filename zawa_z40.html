<html lang="pl">
<head>
	<meta charset="UTF-8">
	<title>Zawadzki Z40_JS</title>
</head>
<body>

<script>
	var x = prompt("podaj argument x=", "");
	var x_zaw = parseFloat(x);

	document.write("x=" + x_zaw + "<br>");

	function f_zaw(x_zaw)
	{
		if (x_zaw >= 1)
		{
			return 1;
		}
		else if (x_zaw >= -2 && x_zaw < 1)
		{
			return x_zaw * x_zaw;
		}
		else
		{
			return 4;
		}
	}

	document.write("f=" + f_zaw(x_zaw).toFixed(2));
</script>

</body>
</html>
