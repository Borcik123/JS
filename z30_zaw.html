<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 30 - Numer 27</title>
    <script type="text/javascript">
        var Telefon = {
            siec: 'Orange',
            model: 'iPhone 15',
            kolor: 'Tytanowy',
            
            Telefon_wyswietl_TwojeNazwisko: function() {
                document.write("Wartości obiektu Telefon:<br>");
                document.write("Sieć: " + this.siec + "<br>");
                document.write("Model: " + this.model + "<br>");
                document.write("Kolor: " + this.kolor + "<br>");
            }
        };

        function uruchomKod() {
            Telefon.Telefon_wyswietl_TwojeNazwisko();
        }
    </script>
</head>
<body>

    <h2>Zadanie 30 - Programowanie Obiektowe</h2>
    
    <button onclick="uruchomKod()">Uruchom metodę obiektu Telefon</button>

    <hr>

    <p>
        <strong>Opis zadania (Nr 27):</strong><br>
        Obiekt: <b>Telefon</b><br>
        Pola: <b>siec, model, kolor</b><br>
        Metoda: <b>Telefon_wyswietl_TwojeNazwisko</b>
    </p>

</body>
</html>
