	<input type="button" value="Oblicz" onclick="fun_zaw()">

<script>
function fun_zaw(){
	var x_zaw=prompt("Podaj kolor",""); var txt=x_zaw.toLowerCase();

	if (x_zaw == 1 || txt == "czerwony")
	{
		document.write('<h1 style="color:red;">wczytałeś kolor czerwony</h1>');
	}
	else if (x_zaw == 2 || txt == "niebieski")
	{
		document.write('<h6 style="color:blue;">wczytałeś kolor niebieski</h6>');
	}
}
</script>
